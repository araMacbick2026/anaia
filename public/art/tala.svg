<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- ANAIA character master: flat three-quarter seated pose. Both legs rest on the footplate. -->
  <g stroke="#294a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="164" cy="293" rx="111" ry="10" fill="#294a48" opacity=".08" stroke="none"/>
    <!-- Chair back, frame and far wheel, behind the seated figure. -->
    <path d="M210 169v58h-76" fill="none" stroke="#608b83" stroke-width="12"/>
    <circle cx="193" cy="245" r="44" fill="#d7ebe3"/>
    <circle cx="193" cy="245" r="33" fill="none" stroke="#86afa2" stroke-width="4"/>
    <circle cx="193" cy="245" r="5" fill="#608b83" stroke="none"/>
    <path d="m193 245-43-24-33 48m33-48h-29" fill="none" stroke="#608b83" stroke-width="7"/>
    <path d="M119 265v12" fill="none"/>
    <circle cx="119" cy="282" r="9" fill="#608b83"/>
    <!-- Two knees, two lower legs and two matching shoes; never attached to a wheel. -->
    <path d="M146 211h31v18h-31z" fill="#498e83"/>
    <path d="M146 231v29m20-29v29" fill="none" stroke="#ddb18c" stroke-width="14"/>
    <path d="M146 257h-10q-7 0-7 8v3h24v-7q0-4-7-4zm20 0h-5v11h25v-3q0-8-8-8z" fill="#f4c966" stroke-width="4"/>
    <path d="M125 274h65" fill="none" stroke="#608b83" stroke-width="7"/>
    <!-- Shirt and relaxed arms. -->
    <path d="M130 160q27-17 55 0l12 58h-70z" fill="#498e83"/>
    <path d="M142 160v25h37v-25" fill="none" stroke="#f6eacb" stroke-width="8"/>
    <path d="m128 175-17 32 17 8m61-40 21 27-17 15" fill="none" stroke="#ddb18c" stroke-width="16"/>
    <!-- Communication board held across the lap, with three simple picture spaces. -->
    <rect x="119" y="199" width="81" height="37" rx="8" fill="#fff9e8"/>
    <path d="M132 215h11m10 0h11m10 0h11" stroke="#498e83" stroke-width="9"/>
    <!-- Preserve Tala's original face, bob haircut and star clip. -->
    <path d="M108 94q-2-65 52-65t56 65v49q-21 20-54 19t-57-20z" fill="#333e3b"/>
    <ellipse cx="162" cy="100" rx="45" ry="49" fill="#ddb18c"/>
    <path d="M118 85q36-8 48-36 8 25 42 34" fill="#333e3b"/>
    <path d="M138 101v3m46-3v3" stroke-width="6"/>
    <path d="M150 123q12 10 24 0" fill="none"/>
    <circle cx="132" cy="116" r="6" fill="#d78879" stroke="none"/>
    <circle cx="192" cy="116" r="6" fill="#d78879" stroke="none"/>
    <path d="m208 57 5 10 11 2-8 8 2 12-10-5-10 5 2-12-8-8 11-2z" fill="#f4c966" stroke-width="3"/>
  </g>
</svg>
